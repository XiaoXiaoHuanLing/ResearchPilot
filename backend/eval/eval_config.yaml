dataset:
  path: eval/dataset_builder/qa_dataset.json
  kb_ids: [2]

llm:
  model: "qwen3.5-plus-2026-02-15"
  pricing:
    input_per_1k_tokens: 0.0005
    output_per_1k_tokens: 0.001

report:
  suggestion_thresholds:
    faithfulness: 0.7
    context_recall: 0.7
    context_precision: 0.6
    hybrid_advantage_delta: 0.1
    latency_ms: 3000

retrieval:
  enabled: true
  compare_modes:
    - name: dense_only
      params:
        retrieval_mode: dense
        top_k: 5
    - name: hybrid_no_merge
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 1.0
        top_k: 5
    - name: hybrid_merge_0.3
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 0.3
        top_k: 5
    - name: hybrid_merge_0.5
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 0.5
        top_k: 5
    - name: hybrid_merge_0.7
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 0.7
        top_k: 5
    - name: hybrid_top3
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 0.5
        top_k: 3
    - name: hybrid_top10
      params:
        retrieval_mode: hybrid
        auto_merging_thresh: 0.5
        top_k: 10
  metrics:
    - recall
    - precision
    - mrr
    - ndcg
    - hit_rate
    - latency
  group_by:
    - question_type
    - difficulty

answer:
  enabled: true
  ragas_metrics:
    - faithfulness
    - context_recall
    - answer_relevancy
    - context_precision
  top_k: 5
  generate_prompt: |
    基于以下检索到的上下文回答问题。只使用上下文中的信息，
    如果上下文不足以回答，请说明。

    上下文：
    {context}

    问题：{question}

e2e:
  enabled: false
  chat_endpoint: http://localhost:8000/api/chat
  extra_metrics:
    - fact_coverage
    - key_phrase_recall
    - token_cost
    - latency
