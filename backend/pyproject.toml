[project]
name = "researchpilot-backend"
version = "0.1.0"
description = "ResearchPilot FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.40",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "apscheduler>=3.11.0",
  "openai>=1.30.0",
  "numpy>=1.26.0",
  "langchain>=1.2.15",
  "langchain-openai>=1.1.12",
  "langgraph>=1.1.6",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.14.3",
  "readability-lxml>=0.8.4.1",
  "lxml>=6.0.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
